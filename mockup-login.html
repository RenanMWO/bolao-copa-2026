<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esboço — Login Bolão Copa 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      background: #0D1117;
      position: relative;
      overflow: hidden;
    }

    /* ── Fundo: estádio via Unsplash ── */
    .bg-stadium {
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1600&q=80');
      background-size: cover;
      background-position: center top;
      z-index: 0;
    }

    /* ── Overlay escuro em duas camadas ── */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(13, 17, 23, 0.82) 0%,
        rgba(13, 17, 23, 0.92) 60%,
        rgba(13, 17, 23, 0.97) 100%
      );
      z-index: 1;
    }

    /* ── Taça decorativa ── */
    .trophy-bg {
      position: fixed;
      bottom: -20px;
      right: -10px;
      width: 340px;
      opacity: 0.13;
      z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 0 40px #f5c51866);
    }

    /* ── Partículas/brilhos sutis ── */
    .sparkle {
      position: fixed;
      border-radius: 50%;
      background: #22c55e;
      opacity: 0.12;
      filter: blur(80px);
      z-index: 2;
      pointer-events: none;
    }
    .sparkle-1 { width: 300px; height: 300px; top: -80px; left: -80px; background: #22c55e; }
    .sparkle-2 { width: 200px; height: 200px; bottom: 100px; right: 200px; background: #f5c518; opacity: 0.06; }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(22, 29, 39, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 44px 40px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* ── Logo / Header ── */
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .trophy-icon {
      font-size: 40px;
      margin-bottom: 10px;
      display: block;
      filter: drop-shadow(0 0 12px #f5c51866);
    }

    .logo-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #E6EDF3;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .logo-title span {
      color: #22c55e;
    }

    .logo-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #8B949E;
      margin-top: 6px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin-bottom: 28px;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #8B949E;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #E6EDF3;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #22c55e;
      background: rgba(34,197,94,0.05);
    }

    input::placeholder { color: #4a5568; }

    /* ── Esqueci senha ── */
    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 24px;
    }

    .forgot a {
      font-size: 12px;
      color: #8B949E;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.2s;
    }

    .forgot a:hover { color: #22c55e; }

    /* ── Botão principal ── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #22c55e;
      color: #0D1117;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover { background: #16a34a; }
    .btn-primary:active { transform: scale(0.98); }

    /* ── Link cadastro ── */
    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #8B949E;
    }

    .signup-link a {
      color: #22c55e;
      text-decoration: none;
      font-weight: 600;
    }

    /* ── Badge copa ── */
    .badge-copa {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 197, 24, 0.1);
      border: 1px solid rgba(245, 197, 24, 0.2);
      border-radius: 100px;
      padding: 4px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #f5c518;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    /* ── Rodapé ── */
    .footer-note {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: rgba(139,148,158,0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Fundo estádio -->
  <div class="bg-stadium"></div>
  <div class="bg-overlay"></div>

  <!-- Brilhos decorativos -->
  <div class="sparkle sparkle-1"></div>
  <div class="sparkle sparkle-2"></div>

  <!-- Taça oficial FIFA (Gazzaniga) — SVG fiel -->
  <svg class="trophy-bg" viewBox="0 0 240 420" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#fff0a0"/>
        <stop offset="30%"  stop-color="#f5c518"/>
        <stop offset="65%"  stop-color="#c8920a"/>
        <stop offset="100%" stop-color="#f5c518"/>
      </linearGradient>
      <radialGradient id="g2" cx="38%" cy="35%" r="55%">
        <stop offset="0%"   stop-color="#fff5c0"/>
        <stop offset="50%"  stop-color="#f5c518"/>
        <stop offset="100%" stop-color="#9a6c00"/>
      </radialGradient>
      <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#3a8c3e"/>
        <stop offset="100%" stop-color="#1a4a1c"/>
      </linearGradient>
    </defs>

    <!-- ════ BASE MALAQUITA (4 degraus) ════ -->
    <rect x="20"  y="385" width="200" height="22" rx="6" fill="url(#g3)"/>
    <rect x="30"  y="365" width="180" height="22" rx="5" fill="url(#g3)" opacity=".9"/>
    <rect x="42"  y="347" width="156" height="20" rx="4" fill="url(#g3)" opacity=".8"/>
    <rect x="54"  y="331" width="132" height="18" rx="4" fill="url(#g3)" opacity=".7"/>
    <!-- sulcos horizontais nos degraus -->
    <line x1="32"  y1="376" x2="208" y2="376" stroke="#fff" stroke-opacity=".07" stroke-width="1"/>
    <line x1="44"  y1="358" x2="196" y2="358" stroke="#fff" stroke-opacity=".07" stroke-width="1"/>
    <line x1="56"  y1="342" x2="184" y2="342" stroke="#fff" stroke-opacity=".07" stroke-width="1"/>

    <!-- ════ HASTE / PESCOÇO ════ -->
    <!-- placa larga inferior -->
    <rect x="80" y="316" width="80" height="17" rx="5" fill="url(#g1)"/>
    <!-- haste estreita -->
    <rect x="106" y="288" width="28" height="30" rx="4" fill="url(#g1)"/>
    <!-- placa larga superior -->
    <rect x="82" y="278" width="76" height="14" rx="4" fill="url(#g1)"/>

    <!-- ════ FIGURA ESQUERDA (torção em espiral) ════ -->
    <!-- pernas -->
    <path d="M100 278 Q88 300 78 315" stroke="url(#g1)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M100 278 Q96 302 92 315" stroke="url(#g1)" stroke-width="9"  fill="none" stroke-linecap="round"/>
    <!-- torso em espiral -->
    <path d="M100 278 Q80 258 72 235 Q64 210 78 190 Q88 172 102 162" stroke="url(#g1)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- braço levantado -->
    <path d="M80 225 Q58 205 62 178 Q65 158 82 143" stroke="url(#g1)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- braço baixo -->
    <path d="M80 225 Q60 235 52 252" stroke="url(#g1)" stroke-width="8"  fill="none" stroke-linecap="round"/>
    <!-- cabeça -->
    <ellipse cx="107" cy="153" rx="14" ry="16" fill="url(#g1)"/>

    <!-- ════ FIGURA DIREITA (espelhada, leve torção oposta) ════ -->
    <!-- pernas -->
    <path d="M140 278 Q152 300 162 315" stroke="url(#g1)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M140 278 Q144 302 148 315" stroke="url(#g1)" stroke-width="9"  fill="none" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M140 278 Q160 258 168 235 Q176 210 162 190 Q152 172 138 162" stroke="url(#g1)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- braço levantado -->
    <path d="M160 225 Q182 205 178 178 Q175 158 158 143" stroke="url(#g1)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- braço baixo -->
    <path d="M160 225 Q180 235 188 252" stroke="url(#g1)" stroke-width="8"  fill="none" stroke-linecap="round"/>
    <!-- cabeça -->
    <ellipse cx="133" cy="153" rx="14" ry="16" fill="url(#g1)"/>

    <!-- ════ GLOBO ════ -->
    <circle cx="120" cy="90" r="62" fill="url(#g2)"/>
    <!-- meridianos/paralelos sutis -->
    <ellipse cx="120" cy="90" rx="62" ry="20" fill="none" stroke="#8a6000" stroke-opacity=".25" stroke-width="1.5"/>
    <ellipse cx="120" cy="90" rx="62" ry="42" fill="none" stroke="#8a6000" stroke-opacity=".15" stroke-width="1"/>
    <line x1="120" y1="28" x2="120" y2="152" stroke="#8a6000" stroke-opacity=".2" stroke-width="1"/>
    <line x1="58"  y1="90" x2="182" y2="90"  stroke="#8a6000" stroke-opacity=".2" stroke-width="1"/>
    <!-- continentes (silhuetas simplificadas) -->
    <!-- América do Sul -->
    <path d="M88 72 Q82 85 84 100 Q88 115 96 112 Q104 108 100 94 Q98 78 88 72Z" fill="#8a6000" opacity=".3"/>
    <!-- Europa/África -->
    <path d="M118 58 Q112 68 114 80 Q118 95 126 98 Q134 96 136 82 Q138 66 128 56 Q123 54 118 58Z" fill="#8a6000" opacity=".25"/>
    <!-- Ásia -->
    <path d="M138 62 Q148 60 158 68 Q164 78 158 88 Q150 94 140 88 Q132 78 138 62Z" fill="#8a6000" opacity=".2"/>
    <!-- brilho -->
    <ellipse cx="98" cy="72" rx="18" ry="12" fill="rgba(255,255,255,0.22)" transform="rotate(-25 98 72)"/>
  </svg>

  <!-- Card de login -->
  <div class="card">
    <div class="logo-area">
      <div class="badge-copa">⚽ FIFA WORLD CUP 2026</div>
      <div class="logo-title">Bolão <span>Copa</span> 2026</div>
      <div class="logo-sub">Entre para fazer seus palpites</div>
    </div>

    <div class="divider"></div>

    <form>
      <div class="field">
        <label>E-mail</label>
        <input type="email" placeholder="seu@email.com" />
      </div>

      <div class="field">
        <label>Senha</label>
        <input type="password" placeholder="••••••••" />
      </div>

      <div class="forgot">
        <a href="#">Esqueci minha senha</a>
      </div>

      <button type="button" class="btn-primary">Entrar</button>
    </form>

    <div class="signup-link">
      Não tem conta? <a href="#">Cadastrar com código</a>
    </div>
  </div>

  <div class="footer-note">Bolão Copa do Mundo 2026 · Powered by Renan</div>

</body>
</html>
